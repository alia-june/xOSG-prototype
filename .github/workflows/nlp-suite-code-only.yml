name: NLP suite code-only checks

on:
  push:
    paths:
      - "nlp-development-suite/**"
      - ".github/workflows/nlp-suite-code-only.yml"
  pull_request:
    paths:
      - "nlp-development-suite/**"
      - ".github/workflows/nlp-suite-code-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run data-free prototype checks
        run: python -B nlp-development-suite/RUN_PROTOTYPE_CHECKS.py
