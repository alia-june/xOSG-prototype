[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-program-wrapper"
version = "0.1.0"
description = "Standalone reference Universal Program Wrapper"
requires-python = ">=3.11"

[project.scripts]
upw = "upw.cli:main"

[tool.setuptools]
packages = ["upw"]
