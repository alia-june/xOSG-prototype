name: Contract-only CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonprivileged-contracts:
    name: Contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: python -m pip install -r requirements.txt
      - name: Run non-privileged contract checks only
        run: python -m unittest -v tests.test_transmigration.ProtocolTests tests.test_transmigration.SourceParityTests tests.test_governed_v0_4.PolicyTests tests.test_windows_v0_5.WindowsContractTests
