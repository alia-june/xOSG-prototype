[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-offline-interpreter"
version = "0.1.0"
description = "Generic deterministic non-executing interpretation framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nlp-offline-interpreter = "nlp_offline_interpreter.integration:main"

[tool.setuptools.packages.find]
where = ["src"]
