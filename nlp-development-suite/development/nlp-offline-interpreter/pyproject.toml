[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-offline-interpreter"
version = "0.1.1rc1"
license = "MIT OR Apache-2.0"
license-files = ["LICENSES/MIT.txt", "LICENSES/Apache-2.0.txt", "LICENSES/NOTICE.txt"]
description = "Generic deterministic non-executing interpretation framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nlp-offline-interpreter = "nlp_offline_interpreter.integration:main"

[tool.setuptools.packages.find]
where = ["src"]
